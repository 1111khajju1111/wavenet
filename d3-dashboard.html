<!-- D3.js Dashboard Implementation -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaveNet - Analytics Dashboard</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/mapbox-gl@3.0.0/dist/mapbox-gl.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/mapbox-gl@3.0.0/dist/mapbox-gl.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            overflow-x: auto;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .dashboard-header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .dashboard-title {
            font-size: 2.5em;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .dashboard-subtitle {
            color: #7f8c8d;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #3498db;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 1.1em;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .chart-title {
            font-size: 1.5em;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .map-container {
            grid-column: 1 / -1;
            height: 500px;
        }

        .filters-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .filter-group {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }

        .filter-group:last-child {
            margin-bottom: 0;
        }

        .filter-label {
            min-width: 120px;
            color: #2c3e50;
            font-weight: 500;
        }

        select, input {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #3498db;
        }

        .timeline-container {
            height: 300px;
        }

        .severity-chart {
            height: 300px;
        }

        .hotspots-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .hotspot-item {
            padding: 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
        }

        .hotspot-location {
            font-weight: bold;
            color: #2c3e50;
        }

        .hotspot-count {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .social-media-feed {
            grid-column: 1 / -1;
            max-height: 400px;
            overflow-y: auto;
        }

        .social-post {
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }

        .post-platform {
            font-size: 0.8em;
            color: #7f8c8d;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .post-content {
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .post-analysis {
            display: flex;
            gap: 15px;
            font-size: 0.8em;
        }

        .analysis-tag {
            padding: 2px 8px;
            border-radius: 12px;
            color: white;
        }

        .severity-low { background-color: #27ae60; }
        .severity-medium { background-color: #f39c12; }
        .severity-high { background-color: #e74c3c; }
        .severity-critical { background-color: #8e44ad; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-label {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <div class="dashboard-header">
            <h1 class="dashboard-title">WaveNet Analytics Dashboard</h1>
            <p class="dashboard-subtitle">Real-time Ocean Hazard Monitoring & Analysis</p>
        </div>

        <!-- Filters -->
        <div class="filters-container">
            <div class="filter-group">
                <label class="filter-label">Time Range:</label>
                <select id="timeRange">
                    <option value="24h">Last 24 Hours</option>
                    <option value="7d" selected>Last 7 Days</option>
                    <option value="30d">Last 30 Days</option>
                    <option value="custom">Custom Range</option>
                </select>
                <input type="date" id="startDate" style="display: none;">
                <input type="date" id="endDate" style="display: none;">
            </div>
            <div class="filter-group">
                <label class="filter-label">Hazard Type:</label>
                <select id="hazardFilter">
                    <option value="all">All Types</option>
                    <option value="tsunami">Tsunami</option>
                    <option value="high_waves">High Waves</option>
                    <option value="storm_surge">Storm Surge</option>
                    <option value="coastal_erosion">Coastal Erosion</option>
                    <option value="debris">Debris</option>
                    <option value="pollution">Pollution</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">Severity:</label>
                <select id="severityFilter">
                    <option value="all">All Levels</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="critical">Critical</option>
                </select>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalReports">0</div>
                <div class="stat-label">Total Reports</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeHazards">0</div>
                <div class="stat-label">Active Hazards</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="socialMentions">0</div>
                <div class="stat-label">Social Media Mentions</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="averageResponse">0</div>
                <div class="stat-label">Avg Response Time (hrs)</div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="charts-grid">
            <!-- Timeline Chart -->
            <div class="chart-container">
                <h3 class="chart-title">Reports Timeline</h3>
                <div id="timelineChart" class="timeline-container"></div>
            </div>

            <!-- Severity Distribution -->
            <div class="chart-container">
                <h3 class="chart-title">Severity Distribution</h3>
                <div id="severityChart" class="severity-chart"></div>
            </div>
        </div>

        <!-- Map and Hotspots -->
        <div class="charts-grid">
            <div class="chart-container map-container">
                <h3 class="chart-title">Hazard Hotspots Map</h3>
                <div id="map" style="height: calc(100% - 60px); border-radius: 8px;"></div>
            </div>

            <div class="chart-container">
                <h3 class="chart-title">Top Hotspots</h3>
                <div id="hotspotsList" class="hotspots-list"></div>
            </div>
        </div>

        <!-- Social Media Feed -->
        <div class="chart-container social-media-feed">
            <h3 class="chart-title">Real-time Social Media Analysis</h3>
            <div id="socialFeed"></div>
        </div>
    </div>

    <script>
        class WaveNetDashboard {
            constructor() {
                this.apiBaseUrl = 'http://localhost:3000/api';
                this.map = null;
                this.markers = [];
                this.currentData = {
                    reports: [],
                    socialMedia: [],
                    hotspots: []
                };
                this.init();
            }

            async init() {
                this.setupEventListeners();
                this.initializeMap();
                await this.loadData();
                this.createCharts();
                
                // Auto-refresh every 30 seconds
                setInterval(() => {
                    this.loadData();
                }, 30000);
            }

            setupEventListeners() {
                document.getElementById('timeRange').addEventListener('change', (e) => {
                    const customInputs = document.querySelectorAll('#startDate, #endDate');
                    if (e.target.value === 'custom') {
                        customInputs.forEach(input => input.style.display = 'inline-block');
                    } else {
                        customInputs.forEach(input => input.style.display = 'none');
                    }
                    this.loadData();
                });

                ['hazardFilter', 'severityFilter', 'startDate', 'endDate'].forEach(id => {
                    document.getElementById(id).addEventListener('change', () => {
                        this.loadData();
                    });
                });
            }

            initializeMap() {
                // Initialize Leaflet map
                this.map = L.map('map').setView([16.5062, 80.6480], 10);

                L.tileLayer('https://api.mapbox.com/styles/v1/mapbox/streets-v11/tiles/{z}/{x}/{y}?access_token=YOUR_MAPBOX_TOKEN', {
                    attribution: '© Mapbox © OpenStreetMap',
                    maxZoom: 18
                }).addTo(this.map);
            }

            async loadData() {
                try {
                    const filters = this.getFilters();
                    const [reportsResponse, socialResponse, hotspotsResponse] = await Promise.all([
                        fetch(`${this.apiBaseUrl}/reports?${new URLSearchParams(filters)}`),
                        fetch(`${this.apiBaseUrl}/social-media/analysis?${new URLSearchParams(filters)}`),
                        fetch(`${this.apiBaseUrl}/reports/hotspots?${new URLSearchParams(filters)}`)
                    ]);

                    this.currentData.reports = await reportsResponse.json();
                    this.currentData.socialMedia = await socialResponse.json();
                    this.currentData.hotspots = await hotspotsResponse.json();

                    this.updateStatistics();
                    this.updateCharts();
                    this.updateMap();
                    this.updateSocialFeed();
                } catch (error) {
                    console.error('Error loading data:', error);
                }
            }

            getFilters() {
                const timeRange = document.getElementById('timeRange').value;
                const hazardType = document.getElementById('hazardFilter').value;
                const severity = document.getElementById('severityFilter').value;

                const filters = {};

                if (hazardType !== 'all') filters.hazardType = hazardType;
                if (severity !== 'all') filters.severity = severity;

                // Handle time range
                const now = new Date();
                if (timeRange === '24h') {
                    filters.startDate = new Date(now - 24 * 60 * 60 * 1000).toISOString();
                } else if (timeRange === '7d') {
                    filters.startDate = new Date(now - 7 * 24 * 60 * 60 * 1000).toISOString();
                } else if (timeRange === '30d') {
                    filters.startDate = new Date(now - 30 * 24 * 60 * 60 * 1000).toISOString();
                } else if (timeRange === 'custom') {
                    const startDate = document.getElementById('startDate').value;
                    const endDate = document.getElementById('endDate').value;
                    if (startDate) filters.startDate = new Date(startDate).toISOString();
                    if (endDate) filters.endDate = new Date(endDate).toISOString();
                }

                return filters;
            }

            updateStatistics() {
                const reports = this.currentData.reports.reports || [];
                const socialData = this.currentData.socialMedia.posts || [];
                
                document.getElementById('totalReports').textContent = reports.length;
                document.getElementById('activeHazards').textContent = 
                    reports.filter(r => ['pending', 'investigating'].includes(r.status)).length;
                document.getElementById('socialMentions').textContent = socialData.length;
                
                // Calculate average response time
                const verifiedReports = reports.filter(r => r.verifiedBy);
                const avgResponseTime = verifiedReports.length > 0 
                    ? verifiedReports.reduce((sum, report) => {
                        const created = new Date(report.createdAt);
                        const verified = new Date(report.updatedAt);
                        return sum + (verified - created) / (1000 * 60 * 60); // hours
                    }, 0) / verifiedReports.length
                    : 0;
                
                document.getElementById('averageResponse').textContent = Math.round(avgResponseTime * 10) / 10;
            }

            createCharts() {
                this.createTimelineChart();
                this.createSeverityChart();
            }

            updateCharts() {
                this.updateTimelineChart();
                this.updateSeverityChart();
                this.updateHotspotsList();
            }

            createTimelineChart() {
                const container = d3.select('#timelineChart');
                container.selectAll('*').remove();

                const margin = { top: 20, right: 30, bottom: 40, left: 50 };
                const width = container.node().getBoundingClientRect().width - margin.left - margin.right;
                const height = 250 - margin.top - margin.bottom;

                this.timelineChart = {
                    svg: container.append('svg')
                        .attr('width', width + margin.left + margin.right)
                        .attr('height', height + margin.top + margin.bottom),
                    width,
                    height,
                    margin
                };
            }

            updateTimelineChart() {
                const reports = this.currentData.reports.reports || [];
                const { svg, width, height, margin } = this.timelineChart;

                // Clear previous content
                svg.selectAll('.chart-content').remove();

                const g = svg.append('g')
                    .attr('class', 'chart-content')
                    .attr('transform', `translate(${margin.left},${margin.top})`);

                // Group reports by day
                const dailyData = d3.rollup(
                    reports,
                    v => v.length,
                    d => d3.timeDay.floor(new Date(d.createdAt))
                );

                const data = Array.from(dailyData, ([date, count]) => ({ date, count }))
                    .sort((a, b) => a.date - b.date);

                if (data.length === 0) {
                    g.append('text')
                        .attr('x', width / 2)
                        .attr('y', height / 2)
                        .attr('text-anchor', 'middle')
                        .style('fill', '#7f8c8d')
                        .text('No data available');
                    return;
                }

                // Scales
                const xScale = d3.scaleTime()
                    .domain(d3.extent(data, d => d.date))
                    .range([0, width]);

                const yScale = d3.scaleLinear()
                    .domain([0, d3.max(data, d => d.count)])
                    .nice()
                    .range([height, 0]);

                // Line generator
                const line = d3.line()
                    .x(d => xScale(d.date))
                    .y(d => yScale(d.count))
                    .curve(d3.curveMonotoneX);

                // Add axes
                g.append('g')
                    .attr('transform', `translate(0,${height})`)
                    .call(d3.axisBottom(xScale).tickFormat(d3.timeFormat('%m/%d')));

                g.append('g')
                    .call(d3.axisLeft(yScale));

                // Add line
                g.append('path')
                    .datum(data)
                    .attr('fill', 'none')
                    .attr('stroke', '#3498db')
                    .attr('stroke-width', 3)
                    .attr('d', line);

                // Add dots
                g.selectAll('.dot')
                    .data(data)
                    .enter().append('circle')
                    .attr('class', 'dot')
                    .attr('cx', d => xScale(d.date))
                    .attr('cy', d => yScale(d.count))
                    .attr('r', 4)
                    .attr('fill', '#3498db')
                    .on('mouseover', function(event, d) {
                        const tooltip = d3.select('body').append('div')
                            .attr('class', 'tooltip')
                            .style('position', 'absolute')
                            .style('background', 'rgba(0, 0, 0, 0.8)')
                            .style('color', 'white')
                            .style('padding', '8px')
                            .style('border-radius', '4px')
                            .style('font-size', '12px')
                            .style('pointer-events', 'none');

                        tooltip.html(`Date: ${d3.timeFormat('%m/%d/%Y')(d.date)}<br>Reports: ${d.count}`)
                            .style('left', (event.pageX + 10) + 'px')
                            .style('top', (event.pageY - 10) + 'px');
                    })
                    .on('mouseout', function() {
                        d3.selectAll('.tooltip').remove();
                    });
            }

            createSeverityChart() {
                const container = d3.select('#severityChart');
                container.selectAll('*').remove();

                const width = container.node().getBoundingClientRect().width;
                const height = 250;
                const radius = Math.min(width, height) / 2 - 20;

                this.severityChart = {
                    svg: container.append('svg')
                        .attr('width', width)
                        .attr('height', height),
                    width,
                    height,
                    radius
                };
            }

            updateSeverityChart() {
                const reports = this.currentData.reports.reports || [];
                const { svg, width, height, radius } = this.severityChart;

                // Clear previous content
                svg.selectAll('.chart-content').remove();

                const g = svg.append('g')
                    .attr('class', 'chart-content')
                    .attr('transform', `translate(${width/2},${height/2})`);

                // Group by severity
                const severityData = d3.rollup(
                    reports,
                    v => v.length,
                    d => d.severity
                );

                const data = Array.from(severityData, ([severity, count]) => ({ 
                    severity, 
                    count,
                    percentage: count / reports.length * 100
                }));

                if (data.length === 0) {
                    g.append('text')
                        .attr('text-anchor', 'middle')
                        .style('fill', '#7f8c8d')
                        .text('No data available');
                    return;
                }

                const colorScale = d3.scaleOrdinal()
                    .domain(['low', 'medium', 'high', 'critical'])
                    .range(['#27ae60', '#f39c12', '#e74c3c', '#8e44ad']);

                const pie = d3.pie()
                    .value(d => d.count)
                    .sort(null);

                const arc = d3.arc()
                    .innerRadius(radius * 0.4)
                    .outerRadius(radius);

                const arcs = g.selectAll('.arc')
                    .data(pie(data))
                    .enter().append('g')
                    .attr('class', 'arc');

                arcs.append('path')
                    .attr('d', arc)
                    .attr('fill', d => colorScale(d.data.severity))
                    .attr('stroke', '#fff')
                    .attr('stroke-width', 2)
                    .on('mouseover', function(event, d) {
                        const tooltip = d3.select('body').append('div')
                            .attr('class', 'tooltip')
                            .style('position', 'absolute')
                            .style('background', 'rgba(0, 0, 0, 0.8)')
                            .style('color', 'white')
                            .style('padding', '8px')
                            .style('border-radius', '4px')
                            .style('font-size', '12px')
                            .style('pointer-events', 'none');

                        tooltip.html(`${d.data.severity}: ${d.data.count} (${d.data.percentage.toFixed(1)}%)`)
                            .style('left', (event.pageX + 10) + 'px')
                            .style('top', (event.pageY - 10) + 'px');
                    })
                    .on('mouseout', function() {
                        d3.selectAll('.tooltip').remove();
                    });

                arcs.append('text')
                    .attr('transform', d => `translate(${arc.centroid(d)})`)
                    .attr('text-anchor', 'middle')
                    .style('fill', '#fff')
                    .style('font-size', '12px')
                    .style('font-weight', 'bold')
                    .text(d => d.data.count);
            }

            updateMap() {
                // Clear existing markers
                this.markers.forEach(marker => this.map.removeLayer(marker));
                this.markers = [];

                const reports = this.currentData.reports.reports || [];
                const hotspots = this.currentData.hotspots.hotspots || [];

                // Add hotspot heatmap
                hotspots.forEach(hotspot => {
                    const circle = L.circle([hotspot.center[1], hotspot.center[0]], {
                        color: this.getHotspotColor(hotspot.intensity),
                        fillColor: this.getHotspotColor(hotspot.intensity),
                        fillOpacity: 0.3,
                        radius: hotspot.radius * 1000 // Convert km to meters
                    }).addTo(this.map);

                    circle.bindPopup(`
                        <strong>Hotspot</strong><br>
                        Reports: ${hotspot.reportCount}<br>
                        Intensity: ${hotspot.intensity}<br>
                        Radius: ${hotspot.radius}km
                    `);

                    this.markers.push(circle);
                });

                // Add individual report markers
                reports.forEach(report => {
                    const marker = L.marker([
                        report.location.coordinates[1],
                        report.location.coordinates[0]
                    ], {
                        icon: this.getMarkerIcon(report.hazardType, report.severity)
                    }).addTo(this.map);

                    marker.bindPopup(`
                        <strong>${report.title}</strong><br>
                        Type: ${report.hazardType}<br>
                        Severity: ${report.severity}<br>
                        Status: ${report.status}<br>
                        <small>${new Date(report.createdAt).toLocaleString()}</small>
                    `);

                    this.markers.push(marker);
                });
            }

            updateHotspotsList() {
                const container = document.getElementById('hotspotsList');
                const hotspots = this.currentData.hotspots.hotspots || [];

                container.innerHTML = '';

                if (hotspots.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #7f8c8d;">No hotspots detected</div>';
                    return;
                }

                hotspots
                    .sort((a, b) => b.reportCount - a.reportCount)
                    .slice(0, 10)
                    .forEach(hotspot => {
                        const item = document.createElement('div');
                        item.className = 'hotspot-item';
                        item.innerHTML = `
                            <div class="hotspot-location">${hotspot.location || 'Unknown Location'}</div>
                            <div class="hotspot-count">${hotspot.reportCount} reports • Intensity: ${hotspot.intensity}</div>
                        `;
                        container.appendChild(item);
                    });
            }

            updateSocialFeed() {
                const container = document.getElementById('socialFeed');
                const posts = this.currentData.socialMedia.posts || [];

                container.innerHTML = '';

                if (posts.length === 0) {
                    container.innerHTML = '<div class="loading">No recent social media mentions</div>';
                    return;
                }

                posts
                    .sort((a, b) => b.analysis.relevanceScore - a.analysis.relevanceScore)
                    .slice(0, 10)
                    .forEach(post => {
                        const item = document.createElement('div');
                        item.className = 'social-post';
                        item.innerHTML = `
                            <div class="post-platform">${post.platform}</div>
                            <div class="post-content">${post.content.substring(0, 200)}${post.content.length > 200 ? '...' : ''}</div>
                            <div class="post-analysis">
                                <span class="analysis-tag severity-${post.analysis.severity}">${post.analysis.hazardType}</span>
                                <span class="analysis-tag severity-${post.analysis.severity}">${post.analysis.severity}</span>
                                <span style="color: #7f8c8d;">Score: ${(post.analysis.relevanceScore * 100).toFixed(0)}%</span>
                            </div>
                        `;
                        container.appendChild(item);
                    });
            }

            getHotspotColor(intensity) {
                if (intensity >= 0.8) return '#8e44ad';
                if (intensity >= 0.6) return '#e74c3c';
                if (intensity >= 0.4) return '#f39c12';
                return '#27ae60';
            }

            getMarkerIcon(hazardType, severity) {
                const colors = {
                    low: '#27ae60',
                    medium: '#f39c12',
                    high: '#e74c3c',
                    critical: '#8e44ad'
                };

                return L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="background-color: ${colors[severity] || colors.medium}; width: 20px; height: 20px; border-radius: 50%; border: 2px solid white;"></div>`,
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
            }
        }

        // Initialize dashboard when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new WaveNetDashboard();
        });
    </script>
</body>
</html>
